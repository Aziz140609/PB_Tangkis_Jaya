</div>

<script>
        // Simple script to toggle password visibility
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            const toggleIcon = togglePasswordBtn.querySelector('span');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle icon
                if (type === 'password') {
                    toggleIcon.textContent = 'visibility';
                    toggleIcon.setAttribute('data-icon', 'visibility');
                } else {
                    toggleIcon.textContent = 'visibility_off';
                    toggleIcon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>
